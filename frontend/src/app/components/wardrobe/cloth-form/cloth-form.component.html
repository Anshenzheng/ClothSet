<form [formGroup]="clothForm" (ngSubmit)="onSubmit()">
  <div class="form-section">
    <label>衣物照片</label>
    <div class="image-upload" (click)="triggerFileInput()">
      <input 
        type="file" 
        #fileInput 
        accept="image/*" 
        (change)="onFileSelected($event)" 
        class="hidden-input"
      >
      <div class="upload-preview" *ngIf="previewImage">
        <img [src]="previewImage" alt="预览">
        <div class="overlay-text">点击更换</div>
      </div>
      <div class="upload-placeholder" *ngIf="!previewImage">
        <span class="upload-icon">📷</span>
        <span>点击上传图片</span>
      </div>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>名称 *</label>
      <input 
        type="text" 
        formControlName="name" 
        class="form-control"
        placeholder="例如：蓝色牛仔外套"
      >
      <div *ngIf="clothForm.get('name')?.invalid && clothForm.get('name')?.touched" class="error-message">
        请输入衣物名称
      </div>
    </div>

    <div class="form-group">
      <label>分类</label>
      <select formControlName="categoryId" class="form-control">
        <option value="">请选择分类</option>
        <option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>品牌</label>
      <input 
        type="text" 
        formControlName="brand" 
        class="form-control"
        placeholder="例如：Nike"
      >
    </div>

    <div class="form-group">
      <label>颜色</label>
      <input 
        type="text" 
        formControlName="color" 
        class="form-control"
        placeholder="例如：蓝色"
      >
    </div>

    <div class="form-group">
      <label>材质</label>
      <input 
        type="text" 
        formControlName="material" 
        class="form-control"
        placeholder="例如：纯棉"
      >
    </div>

    <div class="form-group">
      <label>购买日期</label>
      <input 
        type="date" 
        formControlName="purchaseDate" 
        class="form-control"
      >
    </div>

    <div class="form-group">
      <label>价格</label>
      <input 
        type="number" 
        formControlName="price" 
        class="form-control"
        placeholder="例如：299"
        step="0.01"
      >
    </div>
  </div>

  <div class="form-group">
    <label>描述</label>
    <textarea 
      formControlName="description" 
      class="form-control"
      rows="3"
      placeholder="添加一些描述信息..."
    ></textarea>
  </div>

  <div class="form-group">
    <label>适用季节</label>
    <div class="checkbox-group">
      <label *ngFor="let season of seasons" class="checkbox-item">
        <input 
          type="checkbox" 
          [value]="season.id"
          (change)="onSeasonChange(season.id, $event)"
          [checked]="isSeasonSelected(season.id)"
        >
        <span>{{ season.name }}</span>
      </label>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error-alert">
    {{ errorMessage }}
  </div>

  <div class="form-actions flex justify-end gap-2">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">
      取消
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
      <span *ngIf="!isSubmitting">{{ cloth ? '保存' : '添加' }}</span>
      <span *ngIf="isSubmitting">保存中...</span>
    </button>
  </div>
</form>
